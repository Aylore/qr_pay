version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qrpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # 5433 externally to avoid conflict with local postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6380 externally in case local redis is also running
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Uses internal Docker network — always port 5432 internally
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/qrpay
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-this-in-production-64-chars-minimum
      ENCRYPTION_KEY: ZGV2LWVuY3J5cHRpb24ta2V5LTMyLWJ5dGVzaGVyZQ==
      APP_BASE_URL: http://localhost:8000
      MOCK_GATEWAY_BASE_URL: http://localhost:8000/mock-gateway
      MOCK_GATEWAY_SECRET: mock-gateway-webhook-secret
      FOODICS_WEBHOOK_SECRET: foodics-webhook-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  diner:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/diner:/app
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host"

  dashboard:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5174:5174"
    volumes:
      - ./frontend/dashboard:/app
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data: